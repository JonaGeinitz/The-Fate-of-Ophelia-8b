<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f3">
  <title>The Fate of Ophelia</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f4ef;
      color: #315f5e;
    }

    .card {
      width: min(620px, 100%);
      text-align: center;
    }

    /* The uploaded artwork becomes a circular record/cover.
       It only rotates while the audio is playing. */
    .record-wrap {
      width: min(78vw, 420px);
      aspect-ratio: 1;
      margin: 0 auto 30px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow:
        0 14px 35px rgba(0,0,0,.20),
        0 2px 5px rgba(0,0,0,.10);
      background: #fff;
    }

    .record {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    .record.playing {
      animation: spin 10s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      letter-spacing: .04em;
      font-weight: 500;
    }

    .subtitle {
      margin: 0 0 26px;
      font-size: 1rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .75;
    }

    #playButton {
      width: min(100%, 420px);
      min-height: 76px;
      border: 1px solid rgba(49,95,94,.35);
      border-radius: 18px;
      background: #fff;
      color: #315f5e;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.10);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    #playButton:active {
      transform: scale(.98);
      box-shadow: 0 4px 12px rgba(0,0,0,.10);
    }

    .icon {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 1.6rem;
      margin-bottom: 3px;
    }

    audio {
      width: min(100%, 420px);
      margin-top: 20px;
    }

    .hint {
      margin-top: 16px;
      font: 0.9rem system-ui, sans-serif;
      opacity: .55;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="record-wrap">
      <img id="record" class="record" src="cover.png" alt="The Fate of Ophelia">
    </div>

    <h1>The Fate of Ophelia</h1>
    <p class="subtitle">Orchesterversion</p>

    <button id="playButton" type="button">
      <span class="icon">▶</span>
      MP3 abspielen
    </button>

    <audio id="audio" controls preload="metadata">
      <source src="the_fate_of_ophelia_8b.mp3" type="audio/mpeg">
      Dein Browser unterstützt die Audiowiedergabe nicht.
    </audio>

    <div class="hint">Die Schallplatte dreht sich nur während der Wiedergabe.</div>
  </main>

  <script>
    const audio = document.getElementById("audio");
    const record = document.getElementById("record");
    const button = document.getElementById("playButton");

    function setPlaying(playing) {
      record.classList.toggle("playing", playing);
      button.innerHTML = playing
        ? '<span class="icon">⏸</span>Wiedergabe pausieren'
        : '<span class="icon">▶</span>MP3 abspielen';
    }

    button.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
        } catch (error) {
          // Browser may block playback; the native audio controls remain available.
        }
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", () => setPlaying(true));
    audio.addEventListener("pause", () => setPlaying(false));
    audio.addEventListener("ended", () => setPlaying(false));
  </script>
</body>
</html>
