<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>The Fate of Ophelia</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .player {
      width: min(92vw, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .record-wrap {
      width: min(76vw, 420px);
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: #111;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.12),
        0 18px 55px rgba(0,0,0,.8);
    }

    #record {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      transform: rotate(0deg);
      will-change: transform;
    }

    #playButton {
      width: min(100%, 380px);
      min-height: 72px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 18px;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(0,0,0,.55);
      transition: background .15s ease, transform .12s ease, border-color .15s ease;
    }

    #playButton:hover {
      background: #191919;
      border-color: rgba(255,255,255,.4);
    }

    #playButton:active {
      transform: scale(.98);
    }

    .icon {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 1.55rem;
      line-height: 1;
      margin-bottom: 5px;
    }

    audio {
      width: min(100%, 380px);
      filter: invert(1);
      opacity: .85;
    }
  </style>
</head>

<body>
  <main class="player">
    <div class="record-wrap">
      <img id="record" src="cover.png" alt="The Fate of Ophelia">
    </div>

    <button id="playButton" type="button">
      <span class="icon">▶</span>
      Abspielen
    </button>

    <audio id="audio" controls preload="metadata">
      <source src="the_fate_of_ophelia_8b.mp3" type="audio/mpeg">
      Dein Browser unterstützt die Audiowiedergabe nicht.
    </audio>
  </main>

  <script>
    const audio = document.getElementById("audio");
    const record = document.getElementById("record");
    const button = document.getElementById("playButton");

    // Rotation is tracked manually so pausing keeps the exact current
    // position and the next play continues from that position.
    let angle = 0;
    let lastFrameTime = null;
    let animationFrame = null;
    const degreesPerSecond = 12; // slow rotation

    function rotate(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      const delta = (timestamp - lastFrameTime) / 1000;
      lastFrameTime = timestamp;

      angle = (angle + degreesPerSecond * delta) % 360;
      record.style.transform = `rotate(${angle}deg)`;

      if (!audio.paused && !audio.ended) {
        animationFrame = requestAnimationFrame(rotate);
      } else {
        animationFrame = null;
        lastFrameTime = null;
      }
    }

    function startRotation() {
      if (animationFrame === null) {
        lastFrameTime = null;
        animationFrame = requestAnimationFrame(rotate);
      }
      button.innerHTML = '<span class="icon">⏸</span>Pausieren';
    }

    function stopRotation() {
      if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      lastFrameTime = null;
      // Deliberately do NOT reset angle.
      button.innerHTML = '<span class="icon">▶</span>Abspielen';
    }

    button.addEventListener("click", async () => {
      if (audio.paused || audio.ended) {
        if (audio.ended) audio.currentTime = 0;
        try {
          await audio.play();
        } catch (error) {}
      } else {
        audio.pause();
      }
    });

    audio.addEventListener("play", startRotation);
    audio.addEventListener("pause", stopRotation);
    audio.addEventListener("ended", stopRotation);
  </script>
</body>
</html>
